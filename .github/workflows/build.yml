
name: Build Fabric Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source
        run: unzip -q ElytraShockwave-source.zip

      - name: Build mod
        working-directory: ElytraShockwave
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: elytra-shockwave
          path: ElytraShockwave/build/libs/*.jar
